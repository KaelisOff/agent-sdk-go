name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Reproducible package
        run: |
          go build -o kagent ./cmd/kagent
          for i in 1 2; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o hello ./examples/hello
            ./kagent -manifest examples/hello/manifest.toml -executable hello -o hello-$i.kagent
          done
          cmp hello-1.kagent hello-2.kagent
